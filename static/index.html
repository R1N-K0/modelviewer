<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>modelviewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script>
// Here rather than in app.js, so the page is drawn in the chosen colours from the first frame.
// Dark unless light was chosen in this browser.
let theme = null;
try { theme = localStorage.getItem('theme'); } catch {}
document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="app.js"></script>
</head>
<body>
<canvas id="view"></canvas>
<button type="button" id="theme" aria-label="dark / light">◐</button>
<p id="credit">Models: <a href="https://graphics.stanford.edu/data/3Dscanrep/" target="_blank" rel="noopener">Stanford Computer Graphics Laboratory</a> (bunny, dragon) · Utah teapot · three.js</p>
<nav id="models">
  <button type="button" data-model="dragon">dragon</button>
  <button type="button" data-model="bunny">bunny</button>
  <button type="button" data-model="teapot">teapot</button>
</nav>
</body>
</html>
